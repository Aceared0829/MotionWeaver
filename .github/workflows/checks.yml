name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check tools
        run: python -m pip install "ruff==0.17.5" "pytest>=8"
      - name: Ruff
        run: python -m ruff check .
      - name: Byte-compile maintained packages
        run: python -m compileall -q data training inference model benchmark tools
      - name: Repository guard tests
        run: python -m pytest tests/test_benchmark_paths.py tests/test_no_dead_expressions.py tests/test_verify_repository_layout.py -q
