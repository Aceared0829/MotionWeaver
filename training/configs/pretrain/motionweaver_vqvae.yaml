# MotionWeaver UE training defaults; dataset and output paths are supplied by the CLI.
model:
  pose_vqvae_network:
    _target_: motionweaver.tokenizer.neural_modules.vqvae.VQVAE
    pose_root_mode: pose
    motion_rep: ???
    encoder_state_dim: 241
    decoder_state_dim: 329
    decoder_target_cond_dim: 241
    decoder_external_cond_dim: 2
    feature_mode:
    - joint_positions_and_rotations_and_hip_height
    - pose
    - joint_positions_and_rotations_and_hip_height
    - root_without_hip_height_without_heading
    quantizer_strategy: multihead_ema_reset
    # EMA 衰减。官方默认 0.8；此处曾用 0.99，配合已关闭的死码重置
    # （threshold_ema_dead_code=0）仍会让码本适应过慢。
    # 调到 0.9 让 center 每步吸收 10% 的新批次均值，码本能跟上数据分布。
    quantizer_mu: 0.9
    nb_code: 100000000
    code_dim: 256
    output_emb_width: 256
    down_t: 2
    stride_t: 2
    width: 512
    depth: 4
    dilation_growth_rate: 3
    activation: relu
    num_heads: 8
    kmeans_init: false
    norm: None
    calculate_per_head_perplexity: true
    cond_fusion_last_layer: false
  _target_: training.models.vqvae.motion_vqvae.MotionVQVAEModel
  motion_rep: ???
  pose_vqvae_motion_rep: local
  root_vqvae_network: null
  denoiser:
    backbone:
      llm_shape: null
  args:
    min_tokens: 6
    max_tokens: 16
    down_t: 2
    commit_loss_coeff: 0.02
    # 码字使用熵正则系数。0 = 关闭（官方原行为）。
    # 实测：不开时 full_400k 跑 40,356 步后，per_head=32 的 perplexity
    # 塌缩到 1.29（4% 容量）、最小 1.00，而 recons 仍从 0.52 降到 0.24——
    # 模型在用极少数码字压低重建误差。开启后 -coeff*entropy 推动码字均匀使用。
    # 建议从 0.1 起试。
    usage_entropy_coeff: 0.0
    batchsize_mul_factor: 2
    root_vqvae_max_num_keyframes: 5
    root_vqvae_no_keyframe_prob: 0.25
    pose_vqvae_max_num_keyframes: 10
    pose_vqvae_no_keyframe_prob: 0.25
    keyframe_num_warmup_steps: 200000
    global_root_loss_coeff: 0.5
    local_root_loss_coeff: 0.5
    max_angle_diff: 5.0
    max_norm_ratio: 0.2
    percentage_of_perturbed_samples: 0.2
    floor_estimation: min_joint_height_within_windows
    floor_estimation_window_time: 1.0
    skate_contact_loss_coeff: 0.01
    joint_vel_loss_coeff: 2.0
    # 关节位置损失系数（方案 A）。0 = 关闭，保持原有行为。
    # 直接对「还原后的米制关节位置」算 SmoothL1，与验收指标同口径。
    # 实测该 checkpoint：平均关节距离 171.71 cm、位置 RMSE 103.51 cm，
    # 其中根速度积分漂移 193.39 cm、ric_data 约 116 cm。
    # 这些在 941 维归一化平均里被摊平，靠加步数压不下去。
    # 建议从 0.1 起；数值参考：关节项 SmoothL1 实测均值约 0.49。
    joint_pos_loss_coeff: 0.0
  optimizer:
    _target_: adam_atan2_pytorch.AdamAtan2
    _partial_: true
    lr: 0.0002
    weight_decay: 0.0
  scheduler:
    _target_: training.common.optim.scheduler.WarmupCosineScheduler
    _partial_: true
    num_warmup_steps: 10000
    num_training_steps: ${trainer.max_steps}
    final_lr: 4.0e-06
    last_epoch: -1
    lt_kwargs:
      interval: step
      frequency: 1
trainer:
  _target_: pytorch_lightning.Trainer
  precision: 32
  enable_progress_bar: false
  profiler: null
  check_val_every_n_epoch: null
  detect_anomaly: false
  num_sanity_val_steps: 0
  max_steps: 2000001
  gradient_clip_val: 0.5
  log_every_n_steps: 50
  val_check_interval: 50000
  devices: 8
  num_nodes: 4
  accelerator: gpu
  strategy: ddp
data:
  folder: ???
  text_embeddings: null
skeleton:
  _target_: data.runtime.unreal_dataset.UnrealSkeleton
  folder: ???
motion_rep:
  name: unreal_dual_root_global_joints
  stats:
    _target_: motionweaver.representation.core.utils.stats.Stats
    folder: ???
  _target_: motionweaver.representation.core.motion_reps.dual_root_global_joints.GlobalRootGlobalJoints
fps: 30
